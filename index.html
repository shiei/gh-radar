<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSource Radar</title>
    <script>
      // Theme bootstrap: runs before first paint so the page never flashes the wrong theme.
      // Keep in sync with src/lib/theme/constants.ts and resolveInitialTheme.ts.
      ;(function () {
        var key = 'osr.theme'
        var stored = null
        try {
          stored = window.localStorage.getItem(key)
        } catch (e) {
          stored = null
        }
        // Stored choice wins; otherwise the site default is dark (system preference is not consulted).
        var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
