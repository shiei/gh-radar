<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSource Radar</title>
    <meta
      name="description"
      content="Watch open-source trends: search GitHub repositories, users and topics, browse by category, and follow daily star rankings. Pure frontend, no server."
    />
    <meta name="theme-color" content="#0d1117" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenSource Radar" />
    <meta property="og:title" content="OpenSource Radar" />
    <meta
      property="og:description"
      content="Search GitHub repositories, users and topics, browse by category, and follow daily star rankings."
    />
    <meta property="og:url" content="https://shiei.github.io/gh-radar/" />
    <meta property="og:image" content="https://shiei.github.io/gh-radar/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Theme bootstrap: runs before first paint so the page never flashes the wrong theme.
      // Keep in sync with src/lib/theme/constants.ts and resolveInitialTheme.ts.
      ;(function () {
        var key = 'osr.theme'
        var stored = null
        try {
          stored = window.localStorage.getItem(key)
        } catch (e) {
          stored = null
        }
        // Stored choice wins; otherwise the site default is dark (system preference is not consulted).
        var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
