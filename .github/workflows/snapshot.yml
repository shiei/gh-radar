# Runs scripts/snapshot.ts once a day and commits public/data. Manual runs: Actions > Daily snapshot > Run workflow.
name: Daily snapshot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Take snapshot
        run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          if git diff --quiet -- public/data; then
            echo "no changes"
            exit 0
          fi
          DATE=$(node -p "require('./public/data/meta.json').date")
          TOTAL=$(node -p "require('./public/data/meta.json').total")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: snapshot ${DATE} (${TOTAL} repos)"
          git push
